plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'org.xeniaae'
    compileSdk 35

    defaultConfig {
        // BETA branch: distinct applicationId so the rebase build installs
        // ALONGSIDE the stable org.xeniaae app instead of replacing it. The Java
        // package (namespace) stays org.xeniaae; only the installed package id
        // differs. Drop this ".beta" suffix when folding the rebase into mainline.
        applicationId "org.xeniaae.beta"
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName "0.2.0-beta"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
                cppFlags ''
            }
        }
        sourceSets{
            main {
                //jniLibs.srcDirs = ['src/main/libs']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            //abiFilters 'arm64-v8a'
            //cppFlags ''
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging{
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.preference
    implementation libs.recyclerview
    implementation libs.cardview
    implementation libs.viewpager2
    implementation libs.swiperefreshlayout
    implementation libs.glide
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

}