plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'org.xeniaae'
    compileSdk 35

    defaultConfig {
        // "Canary AE" — the instrumented test/debug build of Xenia AE. Distinct
        // applicationId so it installs ALONGSIDE both the stable org.xeniaae app
        // and org.xeniaae.canary - AEX is the overhaul line and must be
        // A/B-testable against Canary AE on the same device.
        // instead of replacing it (the Java package/namespace stays org.xeniaae;
        // only the installed package id differs). Carries all test/diagnostic
        // code (see docs/TEST_HARNESS.md); Xenia AE (main/gpu-backport) stays
        // clean and only receives changes once proven here.
        applicationId "org.xeniaae.aex"
        minSdk 28
        targetSdk 35
        versionCode 3
        versionName "0.4.0-aex"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                abiFilters 'arm64-v8a'
                cppFlags ''
            }
        }
        sourceSets{
            main {
                //jniLibs.srcDirs = ['src/main/libs']
            }
        }
    }
    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    // Build the NATIVE side optimised even in the debug build type.
                    //
                    // AGP maps the debug build type to CMAKE_BUILD_TYPE=Debug, and the
                    // NDK's Debug config passes no -O flag at all - so clang defaults to
                    // -O0. Every AEX build ever installed and every FPS number ever
                    // measured in this project (see docs/AEX_RESUME_STATE.md) has been an
                    // UNOPTIMISED build of a JIT-based emulator.
                    //
                    // We cannot simply switch to the release build type: AEX *is* the
                    // instrumented line, and it needs debug signing, debuggable=true (for
                    // run-as, simpleperf and /proc/pid/mem), and its own applicationId.
                    // So keep the debug build type and optimise only the C/C++.
                    //
                    // These land in CMAKE_C(XX)_FLAGS, which CMake emits BEFORE
                    // CMAKE_CXX_FLAGS_DEBUG, so a later -O would still win - Debug simply
                    // has none, which is why appending here is sufficient. -g and
                    // -fno-omit-frame-pointer come from the NDK/CMakeLists and are kept:
                    // symbols and frame pointers are what make simpleperf usable.
                    //
                    // NDEBUG is deliberately NOT set here: that would also strip every
                    // assert_true/assert_always, which is a second, independent change.
                    // Optimisation first, measured on its own.
                    cppFlags '-O2'
                    cFlags '-O2'
                }
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    externalNativeBuild {
        cmake {
            //abiFilters 'arm64-v8a'
            //cppFlags ''
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging{
        jniLibs.useLegacyPackaging = true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.preference
    implementation libs.recyclerview
    implementation libs.cardview
    implementation libs.viewpager2
    implementation libs.swiperefreshlayout
    implementation libs.glide
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

}